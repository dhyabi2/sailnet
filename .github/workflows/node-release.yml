name: Node release

# On a version tag: build sailnode + sail for every common platform and attach
# them to the GitHub release. Manual runs upload the binaries as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: "7" }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sail/go.mod
          cache-dependency-path: sail/go.sum
      - name: Build
        working-directory: sail
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          suffix="${GOOS}-${GOARCH}"; [ -n "$GOARM" ] && suffix="${suffix}v${GOARM}"
          mkdir -p ../out
          go build -trimpath -ldflags="-s -w" -o "../out/sailnode-${suffix}${ext}" ./cmd/sailnode
          go build -trimpath -ldflags="-s -w" -o "../out/sail-${suffix}${ext}" ./cmd/sail
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done && sha256sum sail* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
