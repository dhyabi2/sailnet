name: Desktop apps

# macOS .dmg (Apple Silicon and Intel) and Windows .exe of the Sailnet desktop client, built with
# fyne, attached to the release on version tags. Signing happens when the
# certificates are present as secrets; without them the artifacts are
# unsigned and still run. Every artifact ships with a .sha256 next to it (macOS: right-click → Open; Windows: SmartScreen
# "Run anyway").
#
# Secrets, all optional:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application certificate
#   MACOS_SIGN_IDENTITY                          e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for notarytool
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD   code-signing certificate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sail/go.mod
          cache-dependency-path: sail/go.sum
      - name: fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Build .app (arm64 + amd64)
        working-directory: sail/cmd/sailgui
        run: |
          mkdir -p ../../../out
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch fyne package -os darwin -name Sailnet -app-id net.sailnet.desktop -icon Icon.png -release -app-version "${GITHUB_REF_NAME#v}"
            mv Sailnet.app "../../../out/Sailnet-$arch.app"
          done
      - name: Import certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Sign
        if: env.HAS_MAC_CERT == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          for app in out/*.app; do
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$app"
            codesign --verify --strict "$app"
          done
      - name: DMG
        run: |
          for arch in arm64 amd64; do
            name=Intel; [ "$arch" = arm64 ] && name=AppleSilicon   # file names say the chip, not the architecture code
            mkdir -p dmg && cp -R "out/Sailnet-$arch.app" dmg/Sailnet.app && ln -sf /Applications dmg/Applications
            # hdiutil on hosted runners sometimes answers "Resource busy"; retry.
            for try in 1 2 3 4 5; do
              hdiutil create -volname Sailnet -srcfolder dmg -ov -format UDZO "out/Sailnet-macOS-$name.dmg" && break
              sleep 5
            done
            test -f "out/Sailnet-macOS-$name.dmg"
            rm -rf dmg
          done
      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for dmg in out/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Checksums
        run: cd out && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done && cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*

  windows:
    runs-on: windows-latest
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sail/go.mod
          cache-dependency-path: sail/go.sum
      - name: fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Build .exe
        working-directory: sail/cmd/sailgui
        shell: bash
        run: |
          mkdir -p ../../../out
          CGO_ENABLED=1 fyne package -os windows -name Sailnet -app-id net.sailnet.desktop -icon Icon.png -release -app-version "${GITHUB_REF_NAME#v}"
          mv Sailnet.exe ../../../out/Sailnet-Windows.exe
      - name: Sign
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 out\Sailnet-Windows.exe
      - name: Checksums
        shell: bash
        run: cd out && for f in *.exe; do sha256sum "$f" > "$f.sha256"; done && cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*

